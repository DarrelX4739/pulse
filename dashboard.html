<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pulse Dashboard</title>

    <link rel="stylesheet" href="style.css">

    <link rel="icon" type="image/png" href="ChatGPT Image Aug 4, 2026, 08_29_26 PM.png">

</head>

<body class="dashboard">

    <div id="sidebar"></div>

    <main class="main-content">

        <div class="dashboard-card">

            <div class="top-bar">

                <h1>Pulse</h1>

                <button id="logoutBtn">
                    Log Out
                </button>

            </div>

            <div class="welcome">

                <h2 id="greeting">
                    Hello, Darrel 👋
                </h2>

                <p id="quote">
                    Loading today's quote...
                </p>

            </div>

            <div class="info-container">

                <div class="info-card">

                    <h3>Current Time</h3>

                    <p id="time">
                        Loading...
                    </p>

                </div>

                <div class="info-card">

                    <h3>Today's Date</h3>

                    <p id="date">
                        Loading...
                    </p>

                </div>

            </div>

            <div class="dashboard-section">

                <div class="section-header">

                    <h3>Upcoming Tasks</h3>

                </div>

                <div id="todayTasks">

                    <p class="empty-message">

                        🎉 Woohoo! You're all caught up.

                    </p>

                </div>

            </div>

            <div class="dashboard-section">

                <div class="section-header">

                    <h3>Tasks Overview</h3>

                    <span id="completionPercent">

                        100%

                    </span>

                </div>

                <div class="overview-bar">

                    <div id="overviewCompleted"></div>

                    <div id="overviewHigh"></div>

                    <div id="overviewMedium"></div>

                    <div id="overviewLow"></div>

                </div>

                <div class="overview-legend">

                    <span id="completedCount">

                        🟢 0

                    </span>

                    <span id="highCount">

                        🔴 0

                    </span>

                    <span id="mediumCount">

                        🟠 0

                    </span>

                    <span id="lowCount">

                        🟡 0

                    </span>

                </div>

            </div>

        </div>

    </main>

    <script type="module" src="app.js"></script>

</body>

</html>
