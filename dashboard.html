<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Pulse Dashboard</title>

    <link
        rel="stylesheet"
        href="style.css">

</head>

<body class="dashboard">

    <div class="dashboard-card">

        <div class="top-bar">

            <h1>Pulse</h1>

            <button id="logoutBtn">
                Log Out
            </button>

        </div>

        <div class="welcome">

            <h2 id="greeting">
                Hello, Darrel 👋
            </h2>

            <p id="quote">
                Loading today's quote...
            </p>

        </div>

        <div class="info-container">

            <div class="info-card">

                <h3>Current Time</h3>

                <p id="time">
                    Loading...
                </p>

            </div>

            <div class="info-card">

                <h3>Today's Date</h3>

                <p id="date">
                    Loading...
                </p>

            </div>

        </div>

    </div>

    <script
        type="module"
        src="app.js">
    </script>

</body>

</html>
