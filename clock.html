<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Pulse Clock</title>

    <link rel="stylesheet"
        href="style.css">

    <link rel="stylesheet"
        href="clock.css">

    <link rel="icon"
        type="image/png"
        href="ChatGPT Image Aug 4, 2026, 08_29_26 PM.png">

</head>

<body class="clock-page">

    <div id="sidebar"></div>

    <main class="main-content">

        <div class="dashboard-card">

            <div class="top-bar">

                <h1>Clock</h1>

                <button id="logoutBtn">

                    Log Out

                </button>

            </div>

            <!-- =========================
                 Tabs
            ========================== -->

            <div class="clock-tabs">

                <button
                    class="clock-tab active"
                    data-tab="clock">

                    🕒 Clock

                </button>

                <button
                    class="clock-tab"
                    data-tab="timer">

                    ⏲ Timer

                </button>

                <button
                    class="clock-tab"
                    data-tab="stopwatch">

                    ⏱ Stopwatch

                </button>

                <button
                    class="clock-tab"
                    data-tab="pomodoro">

                    🍅 Pomodoro

                </button>

                <button
                    class="clock-tab"
                    data-tab="alarms">

                    ⏰ Alarms

                </button>

            </div>

            <!-- =========================
                 CLOCK
            ========================== -->

            <section
                id="clock"
                class="clock-section active">

                <div class="clock-card">

                    <div
                        id="liveClock"
                        class="live-clock">

                        00:00:00

                    </div>

                    <div
                        id="liveDate"
                        class="live-date">

                        Loading...

                    </div>

                </div>

            </section>

            <!-- =========================
                 TIMER
            ========================== -->

            <section
                id="timer"
                class="clock-section">

                <div class="clock-card">

                    <h2>

                        Countdown Timer

                    </h2>

                    <div class="time-inputs">

                        <input
                            id="timerHours"
                            type="number"
                            min="0"
                            value="0">

                        <input
                            id="timerMinutes"
                            type="number"
                            min="0"
                            max="59"
                            value="0">

                        <input
                            id="timerSeconds"
                            type="number"
                            min="0"
                            max="59"
                            value="0">

                    </div>

                    <div
                        id="timerDisplay"
                        class="big-display">

                        00:00:00

                    </div>

                    <div class="button-row">

                        <button id="startTimer">

                            Start

                        </button>

                        <button id="pauseTimer">

                            Pause

                        </button>

                        <button id="resetTimer">

                            Reset

                        </button>

                    </div>

                </div>

            </section>

            <!-- =========================
                 STOPWATCH
            ========================== -->

            <section
                id="stopwatch"
                class="clock-section">

                <div class="clock-card">

                    <h2>

                        Stopwatch

                    </h2>

                    <div
                        id="stopwatchDisplay"
                        class="big-display">

                        00:00:00.000

                    </div>

                    <div class="button-row">

                        <button id="startStopwatch">

                            Start

                        </button>

                        <button id="lapStopwatch">

                            Lap

                        </button>

                        <button id="resetStopwatch">

                            Reset

                        </button>

                    </div>

                    <div
                        id="lapContainer">

                    </div>

                </div>

            </section>

                        <!-- =========================
                 POMODORO
            ========================== -->

            <section
                id="pomodoro"
                class="clock-section">

                <div class="clock-card">

                    <h2>

                        Pomodoro Timer

                    </h2>

                    <div class="pomodoro-settings">

                        <div class="setting">

                            <label>

                                Work (minutes)

                            </label>

                            <input
                                id="workMinutes"
                                type="number"
                                min="1"
                                value="25">

                        </div>

                        <div class="setting">

                            <label>

                                Short Break

                            </label>

                            <input
                                id="shortBreakMinutes"
                                type="number"
                                min="1"
                                value="5">

                        </div>

                        <div class="setting">

                            <label>

                                Long Break

                            </label>

                            <input
                                id="longBreakMinutes"
                                type="number"
                                min="1"
                                value="15">

                        </div>

                    </div>

                    <div
                        id="pomodoroDisplay"
                        class="big-display">

                        25:00

                    </div>

                    <div
                        id="pomodoroStatus"
                        class="pomodoro-status">

                        Ready to focus

                    </div>

                    <div class="button-row">

                        <button id="startPomodoro">

                            Start

                        </button>

                        <button id="pausePomodoro">

                            Pause

                        </button>

                        <button id="resetPomodoro">

                            Reset

                        </button>

                    </div>

                </div>

            </section>

            <!-- =========================
                 ALARMS
            ========================== -->

            <section
                id="alarms"
                class="clock-section">

                <div class="clock-card">

                    <h2>

                        Alarms

                    </h2>

                    <div class="alarm-form">

                        <input
                            id="alarmTime"
                            type="time">

                        <input
                            id="alarmLabel"
                            type="text"
                            placeholder="Alarm name">

                    </div>

                    <div class="repeat-days">

                        <label><input class="alarm-day" type="checkbox" value="Mon"> Mon</label>

                        <label><input class="alarm-day" type="checkbox" value="Tue"> Tue</label>

                        <label><input class="alarm-day" type="checkbox" value="Wed"> Wed</label>

                        <label><input class="alarm-day" type="checkbox" value="Thu"> Thu</label>

                        <label><input class="alarm-day" type="checkbox" value="Fri"> Fri</label>

                        <label><input class="alarm-day" type="checkbox" value="Sat"> Sat</label>

                        <label><input class="alarm-day" type="checkbox" value="Sun"> Sun</label>

                    </div>

                    <button
                        id="addAlarm">

                        Add Alarm

                    </button>

                    <div
                        id="alarmList">

                    </div>

                </div>

            </section>

        </div>

    </main>

    <script
        type="module"
        src="clock.js">

    </script>

</body>

</html>
