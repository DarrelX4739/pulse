<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pulse • Clock</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet" href="clock.css">

    <link rel="icon" type="image/png" href="ChatGPT Image Aug 4, 2026, 08_29_26 PM.png">

</head>

<body>

    <div id="sidebar"></div>

    <main class="main-content">

        <div class="dashboard-card">

            <div class="top-bar">

                <h1>Clock</h1>

                <button id="logoutBtn">

                    Log Out

                </button>

            </div>

            <div class="clock-card">

                <div class="clock-face">

                    <div id="hourHand" class="hand hour-hand"></div>

                    <div id="minuteHand" class="hand minute-hand"></div>

                    <div id="secondHand" class="hand second-hand"></div>

                    <div class="centre-dot"></div>

                </div>

                <div class="clock-info">

                    <div id="digitalClock">

                        00:00:00

                    </div>

                    <div id="clockDate">

                        Loading...

                    </div>

                </div>

            </div>

        </div>

    </main>

    <script type="module" src="app.js"></script>

    <script type="module" src="clock.js"></script>

</body>

</html>
