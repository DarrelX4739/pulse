<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pulse • Clock</title>

    <link rel="stylesheet" href="style.css">

    <link rel="icon" type="image/png" href="ChatGPT Image Aug 4, 2026, 08_29_26 PM.png">

    <link rel="stylesheet" href="clock.css">

</head>

<main class="main-content">

    <div class="dashboard-card">

        <div class="top-bar">

            <h1>Clock</h1>

            <button id="logoutBtn">

                Log Out

            </button>

        </div>

        <div class="clock-card">

            <div class="analog-clock">

                <div class="clock-face">

                    <span class="number n12">12</span>
                    <span class="number n3">3</span>
                    <span class="number n6">6</span>
                    <span class="number n9">9</span>

                    <div class="tick t1"></div>
                    <div class="tick t2"></div>
                    <div class="tick t3"></div>
                    <div class="tick t4"></div>
                    <div class="tick t5"></div>
                    <div class="tick t6"></div>
                    <div class="tick t7"></div>
                    <div class="tick t8"></div>

                    <div id="hourHand" class="hand hour-hand"></div>

                    <div id="minuteHand" class="hand minute-hand"></div>

                    <div id="secondHand" class="hand second-hand"></div>

                    <div class="centre-dot"></div>

                </div>

            </div>

            <div class="clock-info">

                <div id="digitalClock">

                    00:00:00

                </div>

                <div id="clockDate">

                    Loading...

                </div>

                <div class="clock-location">

                    Sydney, Australia

                </div>

            </div>

        </div>

    </div>

</main>

<script type="module" src="clock.js"></script>
