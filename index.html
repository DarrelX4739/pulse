<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pulse Login</title>

    <link rel="stylesheet" href="login.css">

    <link rel="icon" type="image/png" href="ChatGPT Image Aug 4, 2026, 08_29_26 PM.png">
</head>

<body>

    <div class="login-card">

        <div class="login-logo">

            <h1>Pulse</h1>

            <p>Your personal productivity hub.</p>

        </div>

        <input
            type="email"
            id="email"
            placeholder="Email">

        <input
            type="password"
            id="password"
            placeholder="Password">

        <button id="loginBtn">

            Sign In

        </button>

        <p id="message"></p>

        <div class="login-footer">

            <p>Pulse © 2026</p>

        </div>

    </div>

    <script type="module" src="app.js"></script>

</body>

</html>
