<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pulse • Tasks</title>

    <link rel="stylesheet" href="style.css">

    <link rel="icon" type="image/png" href="ChatGPT Image Aug 4, 2026, 08_29_26 PM.png">

</head>

<body class="dashboard">

    <div id="sidebar"></div>

    <main class="main-content">

        <div class="dashboard-card">

            <div class="top-bar">

                <h1>Tasks</h1>

                <button id="newTaskBtn">

                    + New Task

                </button>

            </div>

            <div class="info-container">

                <div class="info-card">

                    <h3>Total Tasks</h3>

                    <p id="totalTasks">

                        0

                    </p>

                </div>

                <div class="info-card">

                    <h3>Completed</h3>

                    <p id="completedTasks">

                        0

                    </p>

                </div>

                <div class="info-card">

                    <h3>Remaining</h3>

                    <p id="remainingTasks">

                        0

                    </p>

                </div>

            </div>

            <div class="dashboard-section">

                <div class="section-header">

                    <h3>Your Tasks</h3>

                </div>

                <div id="taskList">

                    <p class="empty-message">

                        🎉 No tasks yet.

                        Click <strong>+ New Task</strong> to get started.

                    </p>

                </div>

            </div>

            <div class="dashboard-section">

                <div class="section-header">

                    <h3>Completed</h3>

                </div>

                <div id="completedTaskList">

                    <p class="empty-message">

                        No completed tasks.

                    </p>

                </div>

            </div>

        </div>

    </main>

    <div id="taskModal" class="task-modal">

        <div class="task-modal-content">

            <h2>New Task</h2>

            <input
                id="taskTitle"
                type="text"
                placeholder="Task title">

            <textarea
                id="taskDescription"
                placeholder="Description (optional)"></textarea>

            <label>

                Priority

            </label>

            <select id="taskPriority">

                <option value="high">

                    🔴 High

                </option>

                <option value="medium">

                    🟠 Medium

                </option>

                <option value="low">

                    🟡 Low

                </option>

            </select>

            <label>

                Due Date

            </label>

            <input
                id="taskDueDate"
                type="date">

            <div class="modal-buttons">

                <button id="cancelTask">

                    Cancel

                </button>

                <button id="saveTask">

                    Add Task

                </button>

            </div>

        </div>

    </div>

    <script type="module" src="app.js"></script>
    <script type="module" src="tasks.js"></script>

</body>

</html>
